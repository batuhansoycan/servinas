# Sunucuda /etc/nginx/sites-available/servinas olarak durur (host nginx, Docker değil).
# Traefik: /docker/n8n/traefik-dynamic/servinas.yml -> http://72.61.91.117:4000
server {
    listen 4000;
    root /var/www/servinas;
    index index.html;

    # Gzip — JS/CSS/HTML dahil tüm metin tabanlı içerikler
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Next.js static assets — içerik hash'li, 1 yıl cache
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Görseller ve fontlar — 30 gün cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML — her deploy'da yeni versiyon görünsün
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static routing
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — JS/CSS/HTML dahil tüm metin tabanlı içerikler
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/html
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Next.js static assets — içerik hash'li, 1 yıl cache
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Görseller ve fontlar — 30 gün cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML — her deploy'da yeni versiyon görünsün
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static routing
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
